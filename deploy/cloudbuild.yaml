steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['save', '-o', '/workspace/storyparity-image.tar', '${_IMAGE}']
  - name: aquasec/trivy:0.61.1
    args: ['image', '--input', '/workspace/storyparity-image.tar', '--exit-code', '1', '--severity', 'CRITICAL', '--ignore-unfixed']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
